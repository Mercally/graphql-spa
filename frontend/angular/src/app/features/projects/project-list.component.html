<section class="page">
  <h1>Projects</h1>

  @if (error()) {
    <div class="error-box">{{ error() }}</div>
  }

  @if (loading()) {
    <p class="loading">Loading projects&hellip;</p>
  } @else {
    <div class="card">
      <table>
        <thead>
          <tr><th>Name</th><th>Status</th><th>Updated</th><th></th></tr>
        </thead>
        <tbody>
          @for (project of items(); track project.id) {
            <tr>
              <td>{{ project.name }}</td>
              <td><span class="badge">{{ project.status }}</span></td>
              <td class="muted">{{ project.updatedAt | date: 'mediumDate' }}</td>
              <td><a [routerLink]="['/projects', project.id]">View</a></td>
            </tr>
          } @empty {
            <tr><td colspan="4" class="muted">No projects found.</td></tr>
          }
        </tbody>
      </table>
    </div>
  }
</section>
