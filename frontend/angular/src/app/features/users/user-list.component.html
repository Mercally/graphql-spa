<section class="page">
  <h1>Users</h1>

  @if (error()) {
    <div class="error-box">{{ error() }}</div>
  }

  @if (loading()) {
    <p class="loading">Loading users&hellip;</p>
  } @else {
    <div class="card">
      <table>
        <thead>
          <tr><th>Name</th><th>Email</th><th>Role</th><th></th></tr>
        </thead>
        <tbody>
          @for (user of items(); track user.id) {
            <tr>
              <td>{{ user.name }}</td>
              <td>{{ user.email }}</td>
              <td><span class="badge">{{ user.role }}</span></td>
              <td><a [routerLink]="['/users', user.id]">View</a></td>
            </tr>
          } @empty {
            <tr><td colspan="4" class="muted">No users found.</td></tr>
          }
        </tbody>
      </table>
    </div>
  }
</section>
